name: AI AYFAM CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, add-agents-md-rules* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libdbus-1-3 yara xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Code Style Check (Ruff and pyflakes)
        run: |
          ruff check --select F811,F821,F601,E722 .
          pyflakes . || true

      - name: Security Static Analysis (Bandit)
        run: |
          bandit -r engine/ tools/ core/ utils/ -s B101,B108,B110,B311,B404,B603,B607 || true

      - name: Dependency Audit (pip-audit)
        run: |
          pip-audit || true

      - name: Type Check Engine (mypy)
        run: |
          mypy engine/ --ignore-missing-imports || true

      - name: Run Pytest Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          # Split test execution in Python 3.10 to prevent C-extension/PyQt6 state cleanup conflicts across test modules
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest -q tests/test_glass_engine.py tests/test_theme_and_colors.py
          else
            xvfb-run -a python -m pytest -q --ignore=tests/test_glass_engine.py --ignore=tests/test_glass_components.py --ignore=tests/test_gui_app.py --ignore=tests/test_gui_empty_states.py --ignore=tests/test_task11_ui_modular.py
            xvfb-run -a python -m pytest -q tests/test_glass_engine.py tests/test_glass_components.py tests/test_gui_app.py tests/test_gui_empty_states.py tests/test_task11_ui_modular.py
          fi
