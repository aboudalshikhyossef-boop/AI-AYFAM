name: AI AYFAM CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, add-agents-md-rules* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libdbus-1-3 yara xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Code Style Check (Ruff)
        run: |
          # Enforce the selected correctness/safety rules without failing on legacy
          # repository-wide unused-import warnings that predate this workflow.
          ruff check --select F811,F821,F601,E722 .

      - name: Security Static Analysis (Bandit)
        run: |
          bandit -ll -r engine/ tools/ core/ utils/ -s B101,B108,B110,B311,B404,B603,B607

      - name: Dependency Audit (pip-audit)
        run: |
          pip-audit

      - name: Type Check Engine (mypy)
        run: |
          mypy engine/ --ignore-missing-imports || echo "::warning::mypy reported type issues (advisory)"

      - name: Run Pytest Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          # Run the complete suite on every supported Python version; split GUI/C-extension groups to isolate Qt cleanup.
          xvfb-run -a python -m pytest -q --ignore=tests/test_glass_engine.py --ignore=tests/test_glass_components.py --ignore=tests/test_gui_app.py --ignore=tests/test_gui_empty_states.py --ignore=tests/test_task11_ui_modular.py
          xvfb-run -a python -m pytest -q tests/test_glass_engine.py tests/test_glass_components.py tests/test_gui_app.py tests/test_gui_empty_states.py tests/test_task11_ui_modular.py
