name: AI AYFAM CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, add-agents-md-rules* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libdbus-1-3 yara xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Show pinned dependency versions
        run: |
          pip show defusedxml bandit pip-audit pypdf

      - name: Code Style Check (Ruff)
        run: |
          # Enforce selected correctness/safety rules without failing on legacy repository-wide unused-import warnings.
          ruff check --select F811,F821,F601,E722 .

      - name: Security Static Analysis (Bandit)
        run: |
          bandit -ll -r engine/ tools/ core/ utils/ model_factory/ -s B101,B108,B110,B311,B404,B603,B607

      - name: Dependency Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Type Check Engine (mypy)
        run: |
          mypy engine/ --ignore-missing-imports || echo "::warning::mypy reported type issues (advisory)"

      - name: Run targeted regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_phase5_release.py tests/test_task9_pkginventory.py tests/test_http_client.py

      - name: Run Pytest Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          xvfb-run -a python -m pytest -q --ignore=tests/test_glass_engine.py --ignore=tests/test_glass_components.py --ignore=tests/test_gui_app.py --ignore=tests/test_gui_empty_states.py --ignore=tests/test_task11_ui_modular.py
          xvfb-run -a python -m pytest -q tests/test_glass_engine.py tests/test_glass_components.py tests/test_gui_app.py tests/test_gui_empty_states.py tests/test_task11_ui_modular.py

  model-factory:
    name: from-scratch model tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 ruff==0.15.5 pip-audit==2.10.1 defusedxml==0.7.1 pypdf==6.21.4
      - name: Install optional CPU-only PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-training.txt
      - name: Lint model factory
        run: |
          ruff check --select F811,F821,F601,E722 model_factory/ tests/test_model_factory_core.py tests/test_model_factory_torch.py tests/test_model_factory_bpe.py tests/test_model_factory_corpus_tools.py tests/test_model_factory_corpus_workspace.py tests/test_model_factory_document_ingestion.py tests/test_model_factory_seed_corpus.py tests/test_model_factory_inference.py tests/test_model_factory_runner.py
      - name: Audit optional training dependencies
        run: |
          pip-audit -r requirements-training.txt
      - name: Test from-scratch model and corpus workflow
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_model_factory_core.py tests/test_model_factory_torch.py tests/test_model_factory_bpe.py tests/test_model_factory_corpus_tools.py tests/test_model_factory_corpus_workspace.py tests/test_model_factory_document_ingestion.py tests/test_model_factory_seed_corpus.py tests/test_model_factory_inference.py tests/test_model_factory_runner.py
