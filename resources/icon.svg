<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Rotating dashed outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="1.5"
    stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Hexagon outline -->
  <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.35"/>

  <!-- Core shield -->
  <path d="M50 22 L70 32 V50 C70 65 61 73 50 78 C39 73 30 65 30 50 V32 Z"
    fill="url(#coreGrad)" stroke="url(#ringGrad)" stroke-width="1.5"/>

  <!-- Checkmark -->
  <path d="M42 50 L48 56 L60 42" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
